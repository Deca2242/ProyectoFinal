spring.application.name=proyectoFinal

# Perfiles: "dev" (por defecto, con valores locales y datos de prueba) y "prod" (todo por variables de entorno)
spring.profiles.default=dev

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# PostgreSQL: se sobreescribe con variables de entorno (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ProyectoFinalDB}
spring.datasource.username=${DB_USERNAME:Cristian}
spring.datasource.password=${DB_PASSWORD:2242}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configurations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT: valor por defecto solo para desarrollo y tests; el perfil prod exige JWT_SECRET sin valor por defecto
jwt.secret=${JWT_SECRET:615da61a80ef2c5c635552296cf94fa10173624dd996d010f4a8777e128dda83}
jwt.expiration=${JWT_EXPIRATION:3600000}

# Observabilidad (Actuator/Micrometer): health público, el resto requiere rol ADMIN
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
