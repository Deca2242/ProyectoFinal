spring.application.name=proyectoFinal

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# PostgreSQL database configuration (Docker)
# Se pueden sobreescribir con variables de entorno (DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ProyectoFinalDB}
spring.datasource.username=${DB_USERNAME:Cristian}
spring.datasource.password=${DB_PASSWORD:2242}
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA configurations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true


# JWT Configuration
# En produccion definir JWT_SECRET con un valor propio; el valor por defecto es solo para desarrollo
jwt.secret=${JWT_SECRET:615da61a80ef2c5c635552296cf94fa10173624dd996d010f4a8777e128dda83}
jwt.expiration=${JWT_EXPIRATION:3600000}


