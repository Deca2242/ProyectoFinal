# Perfil de producción: sin valores por defecto, la aplicación no arranca si falta alguna variable
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}
spring.jpa.show-sql=false
# Logs estructurados (ECS) para agregadores
logging.structured.format.console=ecs
# Los usuarios sembrados por V2 se desactivan al arrancar salvo el admin, cuya contraseña se toma de ADMIN_INITIAL_PASSWORD
app.seed.harden=true
app.admin.initial-password=${ADMIN_INITIAL_PASSWORD}
